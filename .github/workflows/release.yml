name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init --ci

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=hermes" > keystore.properties
          echo "password=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ runner.temp }}/release.jks" >> keystore.properties
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ runner.temp }}/release.jks
          ls -la ${{ runner.temp }}/release.jks
          cat keystore.properties

      - name: Patch build.gradle for signing
        run: bash scripts/setup-signing.sh

      - name: Build APK
        run: npx tauri android build --apk

      - name: List APK outputs
        if: always()
        run: find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "No APKs found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-mobile-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true
