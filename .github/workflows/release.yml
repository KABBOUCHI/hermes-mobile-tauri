name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=upload" > keystore.properties
          echo "password=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ runner.temp }}/release.jks" >> keystore.properties
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ runner.temp }}/release.jks

      - name: Patch build.gradle for signing
        run: bash scripts/setup-signing.sh

      - name: Debug - show patched build.gradle.kts
        run: cat src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK (debug)
        run: npx tauri android build -- --apk
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: Build APK (release)
        run: npx tauri android build -- --apk
        if: startsWith(github.ref, 'refs/tags/')

      - name: List APK outputs
        if: always()
        run: find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "No APKs found"

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: hermes-debug.apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true
