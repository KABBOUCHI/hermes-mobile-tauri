name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android
        run: npx tauri android init --ci

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=hermes" > keystore.properties
          echo "password=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ runner.temp }}/release.jks" >> keystore.properties
          echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ runner.temp }}/release.jks

      - name: Patch build.gradle for signing
        run: bash scripts/setup-signing.sh

      - name: Build APK
        run: npx tauri android build --apk

      - name: Find and publish APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Looking for APKs ==="
          find src-tauri/gen/android -name "*.apk" -type f
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"
          # Create release using gh CLI
          gh release create "${{ github.ref_name }}" "$APK" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Tauri Android APK — universal build (arm64, armv7, x86, x86_64)" \
            --draft
          echo "Release created!"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
